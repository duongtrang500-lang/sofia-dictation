<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sofia Dictation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;padding:12px}
main{max-width:800px;margin:auto;background:#fff;padding:17px;border-radius:20px}h1{margin:0 0 5px;font-size:27px}.muted{color:#6e6e73;font-size:14px}
.status{background:#f2f2f7;padding:11px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
button{border:0;border-radius:13px;min-height:55px;font-size:17px;font-weight:650;background:#f2f2f7}.primary{background:#007aff;color:#fff}
textarea{width:100%;min-height:155px;border:1px solid #d2d2d7;border-radius:14px;padding:14px;font-size:20px;line-height:1.45}
.answer{display:none;background:#f2f2f7;border-radius:14px;padding:14px;font-size:19px;line-height:1.45;margin-top:10px}
video{width:100%;max-height:430px;background:#000;border-radius:14px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px}.row input{width:70px;padding:7px;font-size:16px}
</style></head><body><main>
<h1>🎬 Sofia Dictation</h1><div class="muted">S1E1 · Just One of the Princes · MP4 + 336 câu phụ đề</div>
<div class="status">Câu <b id="n">1 / …</b> · <span id="state">Đang tải…</span></div>
<video id="media" src="sofia.mp4" controls preload="metadata" playsinline></video>
<div class="grid"><button class="primary" id="listen">▶ Nghe câu</button><button id="again">🔁 Nghe lại</button><button id="prev">← Câu trước</button><button id="next">Câu tiếp →</button></div>
<div class="row muted">Offset <input id="off" type="number" value="0" step=".1"> giây</div>
<p><b>Type what you hear:</b></p><textarea id="typed" spellcheck="false" autocapitalize="off"></textarea>
<div class="grid"><button class="primary" id="check">✓ Kiểm tra</button><button id="show">👁 Đáp án</button></div>
<div id="answer" class="answer"></div>
<script>
let subs=[],i=0,timer=null;const a=document.getElementById('media'),typed=document.getElementById('typed'),ans=document.getElementById('answer'),state=document.getElementById('state'),num=document.getElementById('n');
fetch('subs.json').then(r=>r.json()).then(x=>{subs=x;update();state.textContent='Sẵn sàng'}).catch(()=>state.textContent='Không tải được phụ đề');
const off=()=>parseFloat(document.getElementById('off').value)||0;
function update(){num.textContent=`${i+1} / ${subs.length}`;typed.value='';ans.style.display='none'}
function stop(){if(timer){clearInterval(timer);timer=null}}
function play(){if(!subs.length)return;stop();let s=subs[i];a.currentTime=Math.max(0,s.start+off());a.play().catch(()=>state.textContent='Chạm Play trên video một lần rồi thử lại');state.textContent='Đang phát…';timer=setInterval(()=>{if(a.currentTime>=s.end+off()){a.pause();stop();state.textContent='Đã dừng cuối câu';typed.focus()}},40)}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function norm(s){return s.toLowerCase().replace(/[“”"‘’'.,!?;:—–\-]/g,'').replace(/\s+/g,' ').trim()}
listen.onclick=play;again.onclick=play;prev.onclick=()=>{if(i){i--;update();play()}};next.onclick=()=>{if(i<subs.length-1){i++;update();play()}};
show.onclick=()=>{ans.innerHTML='<b>Đáp án:</b><br>'+esc(subs[i].text);ans.style.display='block'};
check.onclick=()=>{let ok=norm(typed.value)===norm(subs[i].text);ans.innerHTML=(ok?'✅ <b>Đúng!</b><br>':'📝 <b>Đáp án:</b><br>')+esc(subs[i].text);ans.style.display='block'};
</script></main></body></html>
