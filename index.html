<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Sofia Dictation</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --soft:#f2f2f7; --line:#d2d2d7;
  --text:#1d1d1f; --muted:#6e6e73; --blue:#007aff; --green:#16853d;
  --red:#c62828; --yellow:#fff5cc;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:12px;
}
main{max-width:820px;margin:auto;background:var(--card);padding:17px;border-radius:20px}
h1{margin:0 0 4px;font-size:28px}
.muted{color:var(--muted);font-size:14px;line-height:1.4}
.status{
  display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  background:var(--soft);padding:11px 12px;border-radius:12px;margin:12px 0
}
video{width:100%;max-height:430px;background:#000;border-radius:14px;margin:7px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
button,select,input{
  font:inherit
}
button{
  border:0;border-radius:13px;min-height:52px;padding:10px 12px;
  font-size:16px;font-weight:650;background:var(--soft);cursor:pointer
}
button:active{transform:scale(.985)}
.primary{background:var(--blue);color:#fff}
.hard.active{background:#ffcc00;color:#111}
.controls{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  background:#fafafa;border:1px solid #eee;border-radius:14px;padding:10px;margin:10px 0
}
.controls label{font-size:13px;color:var(--muted)}
.controls select,.controls input{
  width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff
}
.toggle{display:flex;align-items:center;gap:7px;margin-top:8px}
.toggle input{width:auto}
textarea{
  width:100%;min-height:155px;border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:20px;line-height:1.45;resize:vertical
}
textarea:focus{outline:3px solid #007aff22;border-color:var(--blue)}
.answer{
  display:none;background:var(--soft);border-radius:14px;padding:14px;
  font-size:19px;line-height:1.5;margin-top:10px
}
.result{min-height:22px;font-weight:700;margin:8px 2px}
.good{color:var(--green)} .bad{color:var(--red)}
.progressBox{margin:12px 0}
.bar{height:9px;background:#e5e5ea;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--blue);width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--soft);padding:9px;border-radius:10px;text-align:center;font-size:13px}
.stat b{display:block;font-size:18px}
.footerActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media(max-width:620px){
  body{padding:7px}
  main{padding:13px;border-radius:16px}
  h1{font-size:25px}
  video{max-height:38vh}
  .controls{grid-template-columns:1fr 1fr}
  .controls .wide{grid-column:1/-1}
  textarea{min-height:145px;font-size:19px}
}

.compareWrap{display:none;margin-top:10px}
.compareLabel{font-size:13px;color:var(--muted);font-weight:700;margin:10px 0 5px}
.compareLine{font-size:20px;line-height:1.8;background:#fafafa;border-radius:12px;padding:10px 12px;word-break:break-word}
.tok{display:inline-block;padding:0 3px;margin:1px;border-radius:4px}
.tok.ok{background:#9bf3b0}
.tok.bad{background:#ffaaaa}
.tok.missing{background:#ffaaaa;text-decoration:underline}
.tok.extra{background:#ffd0d0;text-decoration:line-through}
.arrowCompare{text-align:center;font-size:24px;font-weight:800;margin:3px 0}


/* Anki-style typed-answer feedback */
.compareWrap{
  display:none;
  margin:14px 0 4px;
  padding:14px;
  border-top:1px solid #d7d7d7;
  border-bottom:1px solid #d7d7d7;
}
.compareLabel{display:none}
.compareLine{
  background:transparent;
  border-radius:0;
  padding:5px 2px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:21px;
  line-height:1.65;
  text-align:center;
}
.arrowCompare{
  font-size:0;
  height:1px;
  background:#d7d7d7;
  margin:8px 0;
}
.tok{
  display:inline;
  padding:1px 2px;
  margin:0;
  border-radius:3px;
}
.tok.ok{
  background:transparent;
  color:inherit;
}
.tok.bad,.tok.missing{
  background:#ffd9d9;
  color:#b42318;
  font-weight:700;
  text-decoration:none;
}
.tok.extra{
  background:#ffd9d9;
  color:#b42318;
  font-weight:700;
  text-decoration:line-through;
}
.ankiHint{
  display:none;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<main>
  <h1>🎬 Sofia Dictation</h1>
  <div class="muted">S1E1 · Just One of the Princes</div>

  <div class="status">
    <span>Câu <b id="counter">1 / …</b></span>
    <span id="state">Đang tải…</span>
  </div>

  <video id="media" src="sofia.mp4" controls preload="metadata" playsinline></video>

  <div class="controls">
    <label>Tốc độ
      <select id="speed">
        <option value="0.75">0.75×</option>
        <option value="0.85">0.85×</option>
        <option value="0.9">0.90×</option>
        <option value="1" selected>1.00×</option>
        <option value="1.1">1.10×</option>
        <option value="1.25">1.25×</option>
      </select>
    </label>
    <label>Offset (giây)
      <input id="offset" type="number" value="0" step="0.1">
    </label>
    <label>Số lần lặp
      <select id="repeatCount">
        <option value="1">1 lần</option>
        <option value="2">2 lần</option>
        <option value="3">3 lần</option>
        <option value="5">5 lần</option>
      </select>
    </label>
    <label class="toggle wide">
      <input id="autoRepeat" type="checkbox">
      Tự phát lại theo số lần lặp
    </label>
  </div>

  <div class="grid">
    <button class="primary" id="listen">▶ Nghe câu</button>
    <button id="again">🔁 Nghe lại</button>
    <button id="prev">← Câu trước</button>
    <button id="next">Câu tiếp →</button>
  </div>

  <p><b>Type what you hear:</b></p>
  <textarea id="typed" spellcheck="false" autocapitalize="off" autocomplete="off"
    placeholder="Gõ câu bạn nghe được..."></textarea>

  <div id="result" class="result"></div>

  <div class="grid">
    <button class="primary" id="check">✓ Kiểm tra</button>
    <button id="show">👁 Đáp án</button>
    <button class="hard" id="hard">⭐ Đánh dấu câu khó</button>
    <button id="clearText">Xóa phần nhập</button>
  </div>

  <div id="compareWrap" class="compareWrap">
    <div class="compareLabel">Bạn đã viết</div>
    <div id="userCompare" class="compareLine"></div>
    <div class="arrowCompare">↓</div>
    <div class="compareLabel">Đáp án</div>
    <div id="correctCompare" class="compareLine"></div>
    <div id="ankiHint" class="ankiHint">trên: câu bạn nhập · dưới: đáp án</div>
  </div>
  <div id="answer" class="answer"></div>

  <div class="progressBox">
    <div class="bar"><div id="progressBar"></div></div>
    <div class="stats">
      <div class="stat"><b id="doneStat">0</b>đã học</div>
      <div class="stat"><b id="correctStat">0</b>đúng</div>
      <div class="stat"><b id="hardStat">0</b>câu khó</div>
    </div>
  </div>

  <div class="footerActions">
    <button id="exportHard">🎧 Xuất Anki + audio</button>
    <button id="resetProgress">↺ Xóa tiến độ</button>
  </div>

  <div id="exportStatus" class="muted" style="margin-top:10px"></div>
<p class="muted" style="margin-top:14px">
    Tiến độ được lưu trên chính trình duyệt này. Máy tính: Space nghe/tạm dừng · R nghe lại · ←/→ đổi câu · Enter kiểm tra.
  </p>
</main>

<script>
const STORAGE_KEY='sofiaDictationV3';
let subs=[], index=0, stopTimer=null, repeatPlayed=0;

const media=document.getElementById('media');
const typed=document.getElementById('typed');
const answer=document.getElementById('answer');
const result=document.getElementById('result');
const compareWrap=document.getElementById('compareWrap');
const userCompare=document.getElementById('userCompare');
const correctCompare=document.getElementById('correctCompare');
const state=document.getElementById('state');
const counter=document.getElementById('counter');
const speed=document.getElementById('speed');
const offsetEl=document.getElementById('offset');
const autoRepeat=document.getElementById('autoRepeat');
const repeatCount=document.getElementById('repeatCount');
const hardBtn=document.getElementById('hard');

let data={
  index:0,
  speed:'1',
  offset:0,
  autoRepeat:false,
  repeatCount:'1',
  attempts:{},
  correct:{},
  hard:[]
};

function loadLocal(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(x && typeof x==='object') data={...data,...x};
  }catch(e){}
}
function saveLocal(){
  data.index=index;
  data.speed=speed.value;
  data.offset=parseFloat(offsetEl.value)||0;
  data.autoRepeat=autoRepeat.checked;
  data.repeatCount=repeatCount.value;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
loadLocal();

fetch('subs.json')
  .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json()})
  .then(x=>{
    subs=x;
    index=Math.max(0,Math.min(Number(data.index)||0,subs.length-1));
    speed.value=data.speed||'1';
    offsetEl.value=Number(data.offset)||0;
    autoRepeat.checked=!!data.autoRepeat;
    repeatCount.value=data.repeatCount||'1';
    render();
    state.textContent='Sẵn sàng';
  })
  .catch(e=>state.textContent='Không tải được phụ đề');

function offset(){return parseFloat(offsetEl.value)||0}
function stopMonitor(){if(stopTimer){clearInterval(stopTimer);stopTimer=null}}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function cleanWord(s){
  return String(s)
    .toLocaleLowerCase('en-US')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function words(s){
  return String(s).trim().split(/\s+/).map(x=>({raw:x,key:cleanWord(x)})).filter(x=>x.key);
}
function alignWords(userText,correctText){
  const A=words(userText),B=words(correctText),m=A.length,n=B.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  const op=Array.from({length:m+1},()=>Array(n+1).fill(''));
  for(let i=1;i<=m;i++){dp[i][0]=i;op[i][0]='del'}
  for(let j=1;j<=n;j++){dp[0][j]=j;op[0][j]='ins'}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    if(A[i-1].key===B[j-1].key){dp[i][j]=dp[i-1][j-1];op[i][j]='ok'}
    else{
      const sub=dp[i-1][j-1]+1, del=dp[i-1][j]+1, ins=dp[i][j-1]+1;
      const best=Math.min(sub,del,ins);dp[i][j]=best;
      op[i][j]=best===sub?'sub':best===del?'del':'ins';
    }
  }
  let i=m,j=n,pairs=[];
  while(i>0||j>0){
    const o=op[i][j];
    if(o==='ok'||o==='sub'){pairs.push({type:o,u:A[i-1],c:B[j-1]});i--;j--}
    else if(o==='del'){pairs.push({type:'del',u:A[i-1],c:null});i--}
    else{pairs.push({type:'ins',u:null,c:B[j-1]});j--}
  }
  pairs.reverse();
  const correctCount=pairs.filter(p=>p.type==='ok').length;
  return {pairs,score:n?Math.round(correctCount/n*100):(m?0:100),correctCount,total:n};
}
function tokenHtml(raw,cls,title=''){
  return '<span class="tok '+cls+'"'+(title?' title="'+esc(title)+'"':'')+'>'+esc(raw)+'</span> ';
}
function showComparison(userText,correctText){
  const a=alignWords(userText,correctText);
  let uh='',ch='';
  for(const p of a.pairs){
    if(p.type==='ok'){
      uh+=tokenHtml(p.u.raw,'ok');
      ch+=tokenHtml(p.c.raw,'ok');
    }else if(p.type==='sub'){
      uh+=tokenHtml(p.u.raw,'bad','Từ sai');
      ch+=tokenHtml(p.c.raw,'bad','Từ đúng');
    }else if(p.type==='del'){
      uh+=tokenHtml(p.u.raw,'extra','Từ thừa');
      ch+=tokenHtml('∅','extra','Không có từ này trong đáp án');
    }else if(p.type==='ins'){
      uh+=tokenHtml('___','missing','Bạn thiếu từ này');
      ch+=tokenHtml(p.c.raw,'missing','Từ bị thiếu');
    }
  }
  userCompare.innerHTML=uh||'<span class="muted">(trống)</span>';
  correctCompare.innerHTML=ch||'<span class="muted">(trống)</span>';
  compareWrap.style.display='block';
  document.getElementById('ankiHint').style.display='block';
  return a;
}
function isHard(){return data.hard.includes(index)}
function render(){
  if(!subs.length)return;
  counter.textContent=`${index+1} / ${subs.length}`;
  answer.style.display='none';
  result.textContent='';
  compareWrap.style.display='none';
  userCompare.innerHTML='';correctCompare.innerHTML='';
  typed.value='';
  hardBtn.classList.toggle('active',isHard());
  hardBtn.textContent=isHard()?'★ Đã đánh dấu câu khó':'⭐ Đánh dấu câu khó';

  const done=Object.keys(data.attempts).length;
  const correct=Object.keys(data.correct).length;
  document.getElementById('doneStat').textContent=done;
  document.getElementById('correctStat').textContent=correct;
  document.getElementById('hardStat').textContent=data.hard.length;
  document.getElementById('progressBar').style.width=((done/subs.length)*100)+'%';
  saveLocal();
}
function playCurrent(resetRepeats=true){
  if(!subs.length)return;
  stopMonitor();
  if(resetRepeats) repeatPlayed=0;
  const s=subs[index];
  media.playbackRate=parseFloat(speed.value)||1;
  media.currentTime=Math.max(0,s.start+offset());
  media.play().then(()=>{
    state.textContent='Đang phát…';
  }).catch(()=>{
    state.textContent='Chạm Play trên video một lần rồi thử lại';
  });
  const end=s.end+offset();
  stopTimer=setInterval(()=>{
    if(media.currentTime>=end){
      media.pause(); stopMonitor();
      repeatPlayed++;
      const target=Math.max(1,parseInt(repeatCount.value)||1);
      if(autoRepeat.checked && repeatPlayed<target){
        state.textContent=`Lặp ${repeatPlayed+1}/${target}…`;
        setTimeout(()=>playCurrent(false),450);
      }else{
        state.textContent='Đã dừng cuối câu';
        typed.focus();
      }
    }
  },40);
}
function move(d){
  if(!subs.length)return;
  index=Math.max(0,Math.min(subs.length-1,index+d));
  render();
  playCurrent();
}
function check(){
  if(!subs.length)return;
  const user=typed.value.trim();
  if(!user){result.className='result bad';result.textContent='Bạn chưa nhập câu.';return}
  const expected=subs[index].text;
  const a=showComparison(user,expected);
  data.attempts[index]=(data.attempts[index]||0)+1;
  if(a.score===100)data.correct[index]=true;
  else delete data.correct[index];
  result.className='result '+(a.score===100?'good':'bad');
  result.textContent=a.score===100
    ? '✓ Đúng'
    : `${a.correctCount}/${a.total} từ đúng · ${a.score}%`;
  answer.style.display='none';
  saveLocal();
  renderStatsOnly();
}
function renderStatsOnly(){
  const done=Object.keys(data.attempts).length;
  const correct=Object.keys(data.correct).length;
  document.getElementById('doneStat').textContent=done;
  document.getElementById('correctStat').textContent=correct;
  document.getElementById('hardStat').textContent=data.hard.length;
  if(subs.length)document.getElementById('progressBar').style.width=((done/subs.length)*100)+'%';
}
function toggleHard(){
  const p=data.hard.indexOf(index);
  if(p>=0)data.hard.splice(p,1); else data.hard.push(index);
  data.hard.sort((a,b)=>a-b);
  hardBtn.classList.toggle('active',isHard());
  hardBtn.textContent=isHard()?'★ Đã đánh dấu câu khó':'⭐ Đánh dấu câu khó';
  renderStatsOnly();saveLocal();
}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function wavBlobFromBuffer(buffer){
  const channels=Math.min(2,buffer.numberOfChannels);
  const sampleRate=buffer.sampleRate;
  const frames=buffer.length;
  const bytesPerSample=2;
  const blockAlign=channels*bytesPerSample;
  const dataSize=frames*blockAlign;
  const ab=new ArrayBuffer(44+dataSize);
  const v=new DataView(ab);
  function str(o,s){for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))}
  str(0,'RIFF');v.setUint32(4,36+dataSize,true);str(8,'WAVE');
  str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
  v.setUint16(22,channels,true);v.setUint32(24,sampleRate,true);
  v.setUint32(28,sampleRate*blockAlign,true);v.setUint16(32,blockAlign,true);
  v.setUint16(34,16,true);str(36,'data');v.setUint32(40,dataSize,true);
  let p=44;
  for(let i=0;i<frames;i++){
    for(let c=0;c<channels;c++){
      let x=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));
      v.setInt16(p,x<0?x*32768:x*32767,true);p+=2;
    }
  }
  return new Blob([ab],{type:'audio/wav'});
}
function sliceAudioBuffer(ctx,src,startSec,endSec){
  const start=Math.max(0,Math.floor(startSec*src.sampleRate));
  const end=Math.min(src.length,Math.ceil(endSec*src.sampleRate));
  const len=Math.max(1,end-start);
  const dst=ctx.createBuffer(Math.min(2,src.numberOfChannels),len,src.sampleRate);
  for(let c=0;c<dst.numberOfChannels;c++){
    dst.copyToChannel(src.getChannelData(c).subarray(start,end),c);
  }
  return dst;
}
async function exportHard(){
  if(!data.hard.length){alert('Chưa có câu khó nào được đánh dấu.');return}
  if(typeof JSZip==='undefined'){
    alert('Không tải được thư viện tạo ZIP. Hãy kiểm tra Internet rồi thử lại.');
    return;
  }
  const status=document.getElementById('exportStatus');
  const btn=document.getElementById('exportHard');
  btn.disabled=true;
  try{
    status.textContent='Đang lấy audio từ video…';
    const resp=await fetch('sofia.mp4');
    if(!resp.ok)throw new Error('Không tải được sofia.mp4');
    const arr=await resp.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;
    const ctx=new AC();
    const decoded=await ctx.decodeAudioData(arr.slice(0));

    const zip=new JSZip();
    const rows=[['Audio','English','Episode','Sentence_No','Start','End']];
    let k=0;
    for(const idx of data.hard){
      k++;
      const s=subs[idx];
      status.textContent=`Đang tạo audio ${k}/${data.hard.length}…`;
      const filename='sofia_s1e1_'+String(idx+1).padStart(3,'0')+'.wav';
      const clip=sliceAudioBuffer(ctx,decoded,Math.max(0,s.start+offset()-0.15),s.end+offset()+0.15);
      zip.file(filename,wavBlobFromBuffer(clip));
      rows.push([
        '[sound:'+filename+']',
        s.text,
        'Sofia S1E1',
        String(idx+1),
        s.start.toFixed(3),
        s.end.toFixed(3)
      ]);
      await new Promise(r=>setTimeout(r,0));
    }
    const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n');
    zip.file('Sofia_Anki.csv',csv);
    zip.file('HUONG_DAN.txt',
`SOFIA DICTATION → ANKI

1. Giải nén file ZIP này.
2. Chép toàn bộ file .wav vào thư mục collection.media của Anki.
3. Trong Anki: File > Import > chọn Sofia_Anki.csv.
4. Map:
   Audio   -> field Audio
   English -> field English
   Episode -> field Episode
5. Tạo card:
   Front: {{Audio}}
   Back:  {{FrontSide}}<hr>{{English}}

Tên audio trong CSV dùng cú pháp [sound:...], nên Anki sẽ phát đúng audio sau khi media đã được chép vào collection.media.
`);
    status.textContent='Đang đóng gói ZIP…';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:5}});
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download='Sofia_Anki_Audio.zip';a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    status.textContent=`✓ Đã xuất ${data.hard.length} câu khó kèm audio.`;
    await ctx.close();
  }catch(e){
    console.error(e);
    status.textContent='Không xuất được audio trên trình duyệt này: '+e.message;
  }finally{
    btn.disabled=false;
  }
}
document.getElementById('listen').onclick=()=>playCurrent();
document.getElementById('again').onclick=()=>playCurrent();
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.getElementById('check').onclick=check;
document.getElementById('show').onclick=()=>{
  if(!subs.length)return;
  compareWrap.style.display='none';
  answer.innerHTML='<b>Đáp án:</b><br>'+esc(subs[index].text);
  answer.style.display='block';
};
document.getElementById('hard').onclick=toggleHard;
document.getElementById('clearText').onclick=()=>{typed.value='';typed.focus();result.textContent='';compareWrap.style.display='none'};
document.getElementById('exportHard').onclick=exportHard;
document.getElementById('resetProgress').onclick=()=>{
  if(confirm('Xóa toàn bộ tiến độ, câu đúng và câu khó đã lưu trên trình duyệt này?')){
    localStorage.removeItem(STORAGE_KEY);
    data={index:0,speed:'1',offset:0,autoRepeat:false,repeatCount:'1',attempts:{},correct:{},hard:[]};
    index=0;speed.value='1';offsetEl.value=0;autoRepeat.checked=false;repeatCount.value='1';
    render();state.textContent='Đã xóa tiến độ';
  }
};
speed.onchange=()=>{media.playbackRate=parseFloat(speed.value)||1;saveLocal()};
offsetEl.onchange=saveLocal;
autoRepeat.onchange=saveLocal;
repeatCount.onchange=saveLocal;

document.addEventListener('keydown',e=>{
  if(document.activeElement===typed){
    if(e.key==='Enter' && !e.shiftKey){e.preventDefault();check()}
    return;
  }
  if(e.code==='Space'){e.preventDefault();media.paused?playCurrent():media.pause()}
  else if(e.key==='r'||e.key==='R')playCurrent();
  else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='ArrowRight')move(1);
  else if(e.key==='Enter')check();
});
window.addEventListener('beforeunload',saveLocal);
</script>
</body>
</html>
